name: Pacman Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Pacman SVG
        uses: arivan-amin/pacman-contribution-graph-action@main
        with:
          github-username: m-anwarulkarim
          output-file: pacman-contribution-graph.svg
          dark-output-file: pacman-contribution-graph-dark.svg

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pacman-contribution-graph*.svg
          if git commit -m "chore: update pacman contribution graph"; then
            git push
          fi
